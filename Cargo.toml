[package]
name = "exoshell"
version = "0.7.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"
